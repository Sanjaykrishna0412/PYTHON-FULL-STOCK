<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <form>
        <div>
          <label for="Name">USER NAME </label>
          <input type="text" id="Name" />
          <!--input type="text" placeholder="user name "-->
        </div>
        <section>
           <label for="email">email</label>
           <input type="email" id="email"/>
        </section>
        <div>
            <label for="Age">Age </label>
            <input type="number" id="Age"/>
        </div>
        <div>
            <label for="password">password</label>
            <input type="password" id="password"/>
        </div>
        <div>
            <label for="Gender">Gender</label><br>
            <input type="radio" id="male" name="gender"><label for="male">male</label>
            <input type="radio" id="Female" name="gender"><label for="Female">Female</label>
        </div>
        <div>
            <label for="fav colour">fav colour</label><br>
            <input type="checkbox" id="blue"><label for="blue">blue</label><br>
            <input type="checkbox" id="black"><label for="black">black</label><br>
            <input type="checkbox" id="red"><label for="red">red</label><br>
            <input type="checkbox" id="green"><label for="green">green</label><br>
            <input type="checkbox" id="white"><label for="white">white</label><br>
        </div>
        <div>
            <input type="file">
        </div>
        <div>
            <select>
                <option value="Audi">Audi</option>
                <option value="BMW">BMW</option>
                <option value="ferari">ferari</option>
                <option value="volvo">volvo</option>
                <option value="benz">benz</option>
            </select>
        </div>
        <input type="button" value="submit">
        <button>cancel</button>

    </form>
</body>
</html>
