<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  
    .name{
      color: blue;
    }
    .EMAIL{
      color: blue;
    }
    .NUMBER{
      color: blue;
    }
    .button{
      color: darkblue;
    }
  </style>
</head>
<body>
  <h1>presonal info</h1>
  <p>please provide your name,email address,and phone number</p>

  <form>
       <div class="name">
        <label for="Name">Name</label><br>
        <input type="Name" id="Name" placeholder="e.g.Sanjay Krishna">
       </div>
       <br>
       <div class="EMAIL">
        <label for="Email Address">Email Address</label><br>
        <input type="Email Address" id="Email Address" placeholder="e.g.sanjay880@gmail.com">
       </div>
       <br>
       <div class="NUMBER">
        <label for="Phone Number">Phone Number</label><br>
        <input type="Phone Number" id="Phone Number" placeholder="e.g. +1 234 567 890">
       </div> 
       <br>
       <button class="button">Next Step</button>

  </form>
</body>
</html>
